name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore bicep-ext-netbox.sln

      - name: Build
        run: dotnet build bicep-ext-netbox.sln --configuration Release --no-restore

      - name: Publish (win-x64)
        run: dotnet publish src/bicep-ext-netbox.csproj --configuration Release -r win-x64 -o ./artifacts/win-x64

      - name: Publish (linux-x64)
        run: dotnet publish src/bicep-ext-netbox.csproj --configuration Release -r linux-x64 -o ./artifacts/linux-x64

      - name: Publish (osx-arm64)
        run: dotnet publish src/bicep-ext-netbox.csproj --configuration Release -r osx-arm64 -o ./artifacts/osx-arm64

      - name: Upload artifacts (win-x64)
        uses: actions/upload-artifact@v4
        with:
          name: bicep-ext-netbox-win-x64
          path: ./artifacts/win-x64/

      - name: Upload artifacts (linux-x64)
        uses: actions/upload-artifact@v4
        with:
          name: bicep-ext-netbox-linux-x64
          path: ./artifacts/linux-x64/

      - name: Upload artifacts (osx-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: bicep-ext-netbox-osx-arm64
          path: ./artifacts/osx-arm64/
