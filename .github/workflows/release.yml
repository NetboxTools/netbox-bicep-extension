name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore bicep-ext-netbox.sln

      - name: Publish (win-x64)
        run: dotnet publish src/bicep-ext-netbox.csproj --configuration Release -r win-x64 -o ./release/win-x64 --no-restore

      - name: Publish (linux-x64)
        run: dotnet publish src/bicep-ext-netbox.csproj --configuration Release -r linux-x64 -o ./release/linux-x64 --no-restore

      - name: Publish (osx-arm64)
        run: dotnet publish src/bicep-ext-netbox.csproj --configuration Release -r osx-arm64 -o ./release/osx-arm64 --no-restore

      - name: Package archives
        run: |
          cd release
          tar -czf bicep-ext-netbox-win-x64.tar.gz -C win-x64 .
          tar -czf bicep-ext-netbox-linux-x64.tar.gz -C linux-x64 .
          tar -czf bicep-ext-netbox-osx-arm64.tar.gz -C osx-arm64 .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/bicep-ext-netbox-win-x64.tar.gz
            release/bicep-ext-netbox-linux-x64.tar.gz
            release/bicep-ext-netbox-osx-arm64.tar.gz
