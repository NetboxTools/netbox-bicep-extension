name: Suggestion / Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe the problem you are trying to solve or the workflow you want to enable.
    validations:
      required: true
  - type: input
    id: resource-type
    attributes:
      label: Related NetBox Resource Type
      description: Which NetBox resource type does this relate to (if applicable)?
      placeholder: "e.g. dcim/devices, ipam/ip-addresses"
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear description of what you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, references to NetBox API docs, or examples.
