name: Bug Report
description: Report a bug with the NetBox Bicep Extension
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include any error messages or logs.
    validations:
      required: true
  - type: textarea
    id: bicep
    attributes:
      label: Bicep File
      description: Paste the relevant Bicep code (if applicable).
      render: bicep
  - type: input
    id: netbox-version
    attributes:
      label: NetBox Version
      placeholder: "e.g. 4.5.5"
  - type: input
    id: bicep-version
    attributes:
      label: Bicep CLI Version
      placeholder: "e.g. 0.41.2"
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Windows 11, Ubuntu 24.04"
